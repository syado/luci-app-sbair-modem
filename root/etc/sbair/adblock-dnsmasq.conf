#
# MAC単位の広告ブロック専用dnsmasq。システムのdnsmasq(通常のDHCP/DNS)とは
# 完全に別プロセスで、ポート5300でbr-lan上だけをlistenする。
# 登録されたMACのDNS(53)だけがiptablesのDNATでここへ転送される(adblock.go参照)。

no-resolv
no-hosts
addn-hosts=/tmp/sbair-adblock-hosts.txt
server=1.1.1.1
server=8.8.8.8
port=5300
interface=br-lan
bind-interfaces
